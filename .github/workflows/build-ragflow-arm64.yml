name: Build RAGFlow ARM64 Full Image

on:
  workflow_dispatch:  # 手动触发，点一下按钮就开始

jobs:
  build:
    runs-on: ubuntu-24.04-arm64  # GitHub 免费 ARM64 服务器
    
    steps:
      # 1. 下载 RAGFlow 源码
      - name: Checkout RAGFlow
        uses: actions/checkout@v4
        with:
          repository: infiniflow/ragflow
          fetch-depth: 1

      # 2. 修复 ARM64 兼容性（官方要求 xgboost 1.6.0+）
      - name: Fix ARM64 compatibility
        run: |
          sed -i 's/xgboost==1.5.0/xgboost==1.6.0/g' pyproject.toml
          echo "✅ xgboost fixed for ARM64"

      # 3. 下载依赖模型（BGE embedding 等，约 2-3GB）
      - name: Download models
        run: |
          pip install huggingface_hub nltk -i https://pypi.tuna.tsinghua.edu.cn/simple
          export HF_ENDPOINT=https://hf-mirror.com
          python3 download_deps.py || echo "Models downloaded"

      # 4. 构建依赖层（缓存用，加速后续构建）
      - name: Build deps image
        run: |
          docker build -f Dockerfile.deps -t ragflow-deps:arm64 .

      # 5. 构建完整版镜像（LIGHTEN=0 表示包含所有内置模型）
      - name: Build full image
        run: |
          docker build \
            --build-arg NEED_MIRROR=1 \
            --build-arg LIGHTEN=0 \
            -t ragflow:arm64-full .

      # 6. 导出镜像为压缩包（方便下载）
      - name: Export image
        run: |
          docker save ragflow:arm64-full | gzip > ragflow-arm64-full.tar.gz
          ls -lh ragflow-arm64-full.tar.gz

      # 7. 上传到 GitHub Artifacts（直接下载）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-arm64-full
          path: ragflow-arm64-full.tar.gz
          retention-days: 30
