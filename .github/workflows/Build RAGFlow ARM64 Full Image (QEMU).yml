name: Build RAGFlow ARM64 (Simplified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout RAGFlow
        uses: actions/checkout@v4
        with:
          repository: infiniflow/ragflow
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 直接使用官方 Dockerfile，但通过 buildx 构建 ARM64
      - name: Fix pyproject.toml
        run: |
          sed -i 's/xgboost==1.5.0/xgboost==1.6.0/g' pyproject.toml
          # 移除 onnxruntime-gpu 依赖（ARM64 不支持）
          sed -i '/onnxruntime-gpu/d' pyproject.toml
          # 添加 onnxruntime CPU 版本
          echo "onnxruntime>=1.14.0" >> requirements.txt

      - name: Build and export ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ragflow:arm64-full
          build-args: |
            NEED_MIRROR=1
            LIGHTEN=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: |
          docker save ragflow:arm64-full | gzip > ragflow-arm64-full.tar.gz
          ls -lh ragflow-arm64-full.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-arm64-full
          path: ragflow-arm64-full.tar.gz
          retention-days: 30
